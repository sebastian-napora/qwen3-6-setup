[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lunch-model"
version = "0.1.0"
description = "Local vLLM API server for Qwen3.6-35B-A3B-NVFP4 with compression endpoints"
readme = "readm.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.0",
    "aiohttp>=3.9",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pyinstaller>=6.0",
]
runtime = [
    "vllm-mlx>=0.2",
]

[project.scripts]
qwen-server = "src.qwen3_6_server:run"
qwen-compress = "src.server_compress:main"
qwen-stats = "src.qwen_token_stats_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
