[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lunch-model"
version = "0.1.0"
description = "Local vLLM API server for Qwen3.6-35B-A3B-NVFP4 with compression endpoints"
readme = "readm.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pyinstaller>=6.0",
]
runtime = [
    "vllm>=0.8",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.scripts]
qwen-server = "qwen3_6_server:run"
qwen-compress = "server_compress:__main__"
qwen-stats = "qwen_token_stats_server:main"

[tool.setuptools]
package-data = { "*" = ["*.yaml", "*.yml", "*.sh", "*.md"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["qwen3_6_server*", "qwen3-6-server*", "server_compress*", "qwen36_compress*", "qwen_compress*", "qwen_token*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
