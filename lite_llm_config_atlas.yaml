# LiteLLM Proxy Configuration for Atlas spark backend
#
# Architecture:
#   Copilot / VS Code → LiteLLM (11111) → Atlas spark (9999)
#
# This config is for the atlas stack (no vLLM, no lunch-model backend).
# Used by start-qwen36.sh in the atlas repo.

model_list:
  - model_name: qwen3.6-35b-nvfp4
    litellm_params:
      model: openai/RedHatAI/Qwen3.6-35B-A3B-NVFP4
      api_base: http://localhost:9999/v1
      api_key: none
      max_tokens: 60000
      temperature: 0.7
    model_info:
      supports_vision: true
      supports_function_calling: false
      input_cost_per_token: 0
      output_cost_per_token: 0

  - model_name: qwen36flash
    litellm_params:
      model: openai/RedHatAI/Qwen3.6-35B-A3B-NVFP4
      api_base: http://localhost:9999/v1
      api_key: none
      max_tokens: 60000
      temperature: 0.7
    model_info:
      supports_vision: true
      supports_function_calling: false
      input_cost_per_token: 0
      output_cost_per_token: 0

  - model_name: qwen36-think
    litellm_params:
      model: openai/RedHatAI/Qwen3.6-35B-A3B-NVFP4
      api_base: http://localhost:9999/v1
      api_key: none
      max_tokens: 60000
      temperature: 0.7
      extra_body:
        enable_thinking: true
    model_info:
      supports_vision: true
      supports_function_calling: false
      supports_reasoning: true
      input_cost_per_token: 0
      output_cost_per_token: 0

  - model_name: qwen3.5-35b-nvfp4
    litellm_params:
      model: openai/Sehyo/Qwen3.5-35B-A3B-NVFP4
      api_base: http://localhost:9999/v1
      api_key: none
      max_tokens: 60000
      temperature: 0.7
    model_info:
      supports_vision: false
      supports_function_calling: false
      input_cost_per_token: 0
      output_cost_per_token: 0

litellm_settings:
  drop_params: true
  request_timeout: 300
  set_verbose: false
  system_prompt: |
    You are a helpful, concise coding assistant.
    Match response length to the request: trivial questions get trivial answers.
    Do not repeat reasoning or restart from scratch.
    Do not emit Error:/Exception:/Warning: labels unless there is a genuine error.
    Stop as soon as the task is done.

general_settings:
  completion_model: "qwen3.6-35b-nvfp4"