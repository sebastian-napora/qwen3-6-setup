# LiteLLM Proxy Configuration — route MiniMax-M2.7 → local Qwen on port 11112
#
# Architecture:
#   setup-docs → LiteLLM (11115) → lunch-model vLLM (11112)
#
# Start: ./venv/bin/litellm --config lite_llm_config_minimax.yaml

model_list:
  - model_name: MiniMax-M2.7
    litellm_params:
      model: openai/RedHatAI/Qwen3.6-35B-A3B-NVFP4
      api_base: http://localhost:11112/v1
      api_key: none
      max_tokens: 60000
      temperature: 0.7
    model_info:
      supports_vision: false
      supports_function_calling: true
      supports_reasoning: true
      input_cost_per_token: 0
      output_cost_per_token: 0

  - model_name: MiniMax-M2
    litellm_params:
      model: openai/RedHatAI/Qwen3.6-35B-A3B-NVFP4
      api_base: http://localhost:11112/v1
      api_key: none
      max_tokens: 60000
      temperature: 0.7
    model_info:
      supports_vision: false
      supports_function_calling: true
      supports_reasoning: true
      input_cost_per_token: 0
      output_cost_per_token: 0

litellm_settings:
  drop_params: true
  request_timeout: 300
  set_verbose: false
  system_prompt: |
    You are a helpful, concise coding assistant.
    Match response length to the request: trivial questions get trivial answers.
    Do not repeat reasoning or restart from scratch.
    Do not emit Error:/Exception:/Warning: labels unless there is a genuine error.
    Stop as soon as the task is done.

general_settings:
  completion_model: "MiniMax-M2.7"
  disable_auth: true