# LiteLLM Proxy Configuration for Qwen3.6-35B-A3B-NVFP4
#
# Architecture:
#   Copilot → LiteLLM (11115) → vLLM (11114)
#
# Start vLLM backend (11114):  python3 qwen3_6_server.py
# Start LiteLLM proxy (11115): python3 server_compress.py

model_list:
  - model_name: qwen3.6-35b-nvfp4
    litellm_params:
      model: openai/mlx-community/Qwen3.6-35B-A3B-4bit
      api_base: http://localhost:11114/v1
      api_key: none
      max_tokens: 10000
      temperature: 0.7

  - model_name: qwen36flash
    litellm_params:
      model: openai/mlx-community/Qwen3.6-35B-A3B-4bit
      api_base: http://localhost:11114/v1
      api_key: none
      max_tokens: 10000
      temperature: 0.7

litellm_settings:
  drop_params: true
  request_timeout: 300
  set_verbose: false
  system_prompt: |
    You are a helpful, concise coding assistant.
    Match response length to the request: trivial questions get trivial answers.
    Do not repeat reasoning or restart from scratch.
    Do not emit Error:/Exception:/Warning: labels unless there is a genuine error.
    Stop as soon as the task is done.

general_settings:
  completion_model: "qwen3.6-35b-nvfp4"
