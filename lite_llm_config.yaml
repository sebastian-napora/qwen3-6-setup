# LiteLLM Proxy Configuration for Qwen3.6-35B-NVFP4
#
# Architecture:
#   Copilot → LiteLLM (11111) → vLLM (11112)
#                                        ↑
#                                 /compress @ 11112
#
# Start vLLM backend (11112):  python3 qwen3_6_server.py
# Start LiteLLM proxy (11111): python3 server_compress.py
#
# Or use lite-llm project for multi-model routing.

model_list:
  - model_name: qwen3.6-35b-nvfp4
    litellm_params:
      model: openai/RedHatAI/Qwen3.6-35B-A3B-NVFP4
      api_base: http://localhost:11112/v1
      api_key: none
      # ── Token & sampling ─────────────────────────────────────────────
      max_tokens: 2000           # hard cap — prevents runaway context
      temperature: 0.0           # deterministic — no sampling drift
      # ── Anti-loop ────────────────────────────────────────────────────
      frequency_penalty: 0.05
      presence_penalty: 0.05
      stop: ["<|im_end|>", "<|endoftext|>", "\n\n\n"]
      # ── vLLM-specific (passed via extra_body) ─────────────────────────
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
        repetition_penalty: 1.05

litellm_settings:
  drop_params: true
  request_timeout: 300
  set_verbose: false

general_settings:
  completion_model: ""
